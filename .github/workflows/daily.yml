name: ClearPath Daily Surplus Agent v2

on:
  schedule:
    # 10:00 UTC = 6:00 AM US Eastern Time
    - cron: '0 10 * * *'

  workflow_dispatch:
    inputs:
      lookback_days:
        description: 'Days to look back (default: 90)'
        required: false
        default: '90'

# Shared env injected into every job via env: at job level
env:
  PYTHONPATH: .
  SUPABASE_URL:            ${{ secrets.SUPABASE_URL }}
  SUPABASE_SERVICE_KEY:    ${{ secrets.SUPABASE_SERVICE_KEY }}
  BATCH_SKIP_TRACE_API_KEY: ${{ secrets.BATCH_SKIP_TRACE_API_KEY }}
  BEEN_VERIFIED_API_KEY:   ${{ secrets.BEEN_VERIFIED_API_KEY }}
  ZAPIER_OUTREACH_WEBHOOK: ${{ secrets.ZAPIER_OUTREACH_WEBHOOK }}
  HUBSPOT_API_KEY:         ${{ secrets.HUBSPOT_API_KEY }}
  HUBSPOT_PIPELINE_ID:     ${{ secrets.HUBSPOT_PIPELINE_ID }}
  HUBSPOT_STAGE_NEW_LEAD:  ${{ secrets.HUBSPOT_STAGE_NEW_LEAD }}
  ANTHROPIC_API_KEY:       ${{ secrets.ANTHROPIC_API_KEY }}
  SENTRY_DSN:              ${{ secrets.SENTRY_DSN }}
  SCRAPE_LOOKBACK_DAYS:    ${{ inputs.lookback_days || vars.SCRAPE_LOOKBACK_DAYS || '90' }}
  MIN_SURPLUS_AMOUNT:      ${{ vars.MIN_SURPLUS_AMOUNT || '5000' }}
  DEFAULT_FEE_PERCENTAGE:  ${{ vars.DEFAULT_FEE_PERCENTAGE || '40.0' }}
  LOG_LEVEL: INFO

jobs:
  # ---------------------------------------------------------------
  # Job 1: Seed — inserts scrape tasks for all active counties
  # ---------------------------------------------------------------
  seed:
    name: Seed task queue
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Seed scrape tasks
        run: python src/scheduler.py

  # ---------------------------------------------------------------
  # Job 2: Scrape — one runner per scrape task (drains queue)
  # ---------------------------------------------------------------
  scrape:
    name: Scrape court cases
    needs: seed
    runs-on: self-hosted
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Install Playwright browsers
        run: python -m playwright install chromium
      - name: Run scrape agent
        run: python -m src.agents.scrape_agent
      - name: Upload debug screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scraper-screenshots
          path: ${{ runner.temp }}/screenshots/
          retention-days: 1
      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: scrape-logs-${{ github.run_id }}
          path: logs/
          retention-days: 7

  # ---------------------------------------------------------------
  # Job 3: Docket analysis — LLM surplus detection (drains queue)
  # ---------------------------------------------------------------
  docket:
    name: Analyze dockets (Claude Haiku)
    needs: scrape
    runs-on: self-hosted
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run docket agent
        run: python -m src.agents.docket_agent
      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: docket-logs-${{ github.run_id }}
          path: logs/
          retention-days: 7

  # ---------------------------------------------------------------
  # Job 4: Skip trace — find owner contact info (drains queue)
  # ---------------------------------------------------------------
  skip_trace:
    name: Skip trace owners
    needs: docket
    runs-on: self-hosted
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run skip trace agent
        run: python -m src.agents.skip_trace_agent
      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: skip-trace-logs-${{ github.run_id }}
          path: logs/
          retention-days: 7

  # ---------------------------------------------------------------
  # Job 5: Outreach — fire Zapier webhooks (drains queue)
  # ---------------------------------------------------------------
  outreach:
    name: Trigger outreach
    needs: skip_trace
    runs-on: self-hosted
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run outreach agent
        run: python -m src.agents.outreach_agent
      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: outreach-logs-${{ github.run_id }}
          path: logs/
          retention-days: 7
